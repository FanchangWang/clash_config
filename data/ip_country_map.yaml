# 手动 IP/域名 -> 国家 映射
#
# 用途：ip-api 接口对部分 IP 返回的归属国家是错的，这里手动纠正。
# 命中映射时直接返回结果，不再查询 ip-api 和 GeoIP 数据库。
#
# 规则：
#   - key   填 IP 地址（IPv4 / IPv6 都支持）或域名原值（如 example.com）
#            先按原值查，再按解析/规范化后的 IP 查
#   - IPv6 不用加引号；大小写、前导零、缩写写法会自动规范化后比对
#   - value 填国家中文名，必须与 config.py 里的分类列表用同一套写法
#            （如 日本 / 韩国 / 台湾 / 美国 / 香港 / 荷兰 / 新加坡 ...）
#   - 改完存盘，下次运行即生效，不需要改代码
#
2001:bc8:32d7:17b::3: 西班牙
2001:bc8:32d7:302::14: 西班牙
62.210.70.194: 西班牙
