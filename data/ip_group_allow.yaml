# IP/域名 -> 额外允许加入的分组
#
# 用途：某些服务不是按国家一刀切的（如 Gemini 还分地区），
#       国家不在默认名单里、但实际可用的 IP，在这里单独放行。
#       命中后无视国家/协议条件，直接加入对应分组。
#
# 规则：
#   - key   填 IP 地址（IPv4 / IPv6 都支持）或域名原值，和 ip_country_map.yaml 同一套匹配逻辑
#   - value 填分组字段名，支持列表写法，可选：
#           udp        -> _p_udp
#           ai_gemini  -> _p_ai_gemini（Gemini 可用）
#           porn_x     -> _p_porn_x
#           porn_all   -> _p_porn_all
#           all        -> Sall（默认已包含所有代理，一般不用写）
#   - 写错字段名会告警并忽略该项，不影响其他条目
#
157.254.223.43: [ai_gemini]
